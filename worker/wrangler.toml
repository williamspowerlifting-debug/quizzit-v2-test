name = "quizzit-v2-worker"
main = "src/index.ts"
compatibility_date = "2026-09-11"

[[kv_namespaces]]
binding = "LESSONS"
id = "REPLACE_WITH_YOUR_LESSONS_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_YOUR_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Do not put API keys here. Use `wrangler secret put`.
